<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel='stylesheet' href='/static/css/login.css'>
    <title>영화 목록</title>
    <script>
	if('{{temp}}' == '1'){
		alert('로그인 되었습니다.');
		location.href='/';		
	}else if('{{temp}}' == '0'){
		alert('아이디 또는 패스워드가 일치하지 않습니다.');
	}else if('{{temp}}' == '2'){
		alert('로그아웃 되었습니다.');
		location.href='/';
	}

	function loginBtn(){
		//alert('확인');
		loginFrm.submit();
	}
</script>
</head>
<body>


<!-- HEADER -->
<header>
 
<div class="top">
<div class="logo"><a href="/">MovieWorld</a></div>


<!-- 
<ul class="menu">
<li><a href="/board/mlist/">장르별</a></li>
<li><a href="#">제목</a></li>
<li><a href="#">줄거리</a></li>
<li><a href="#">전체검색</a></li>
</ul>
</div>
--> 
</header>
<!-- VISUAL -->
<section class="visual">
    <div>
        <h1>LOGIN</h1>
        <p>로그인 후 다양한 서비스를 이용하세요.</p>
        <form action="/member/login/" name="loginFrm" method="post">
            {% csrf_token %}
    
            <label for="user-id" class="sr-only"></label>
            <input
                type="text"
                id="user-id"
                name="id"
                class="input-box"
                placeholder="아이디"
                autocomplete="username"
                required
            >
    
            <label for="user-password" class="sr-only"></label>
            <input
                type="password"
                id="user-password"
                name="pw"
                class="input-box"
                placeholder="비밀번호"
                autocomplete="current-password"
                required
            >
    
            <button type="submit" class="btn btn-login">로그인</button>
    
            <div class="idsave">
                <input type="checkbox" id="rememberId" name="rememberId">
                <label for="rememberId">아이디 저장</label>
            </div>
        </form>
    
        <div class="links">
            <a href="#">아이디 찾기</a> |
            <a href="#">비밀번호 찾기</a>
        </div>
    
        <div class="signup-box">
            <p><strong>아직 회원이 아니신가요?</strong></p>
            <p>
                지금 회원가입을 하시면<br>
                다양하고 특별한 혜택이 준비되어 있습니다.
            </p>
            <button
                type="button"
                class="btn-signup"
                onclick="location.href='/member/membership1/'">
                회원가입
            </button>
        </div>
    </div>
</section>

</main>

<!-- FOOTER -->
<footer>
<div class="footer-inner">
    <div class="footer-menu">
        <a href="#">회사소개</a>
        <a href="#">오시는 길</a>
        <a href="#">개인정보처리방침</a>
        <a href="#">이용약관</a>
        <a href="#">이메일무단수집거부</a>
    </div>

<div class="footer-info">
            우리 영화 이야기\
            서울시 관악구 신림동 우장빌딩 5층\
            대표번호 : 010-123-4567
        </div>
    </div>
</footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script  src="http://code.jquery.com/jquery-latest.min.js"></script>
    <title>메인페이지</title>
    <script>
        function sendBtn(){
            // input에 있는 데이터 가져오기
            const send_data = $('#data').val();
            console.log("데이터 : "+send_data);
            // views.py로 데이터 전달
            $.ajax({
                url:'/ajax_data/',
                type:'post',
                headers:{'X-CSRFToken':'{{csrf_token}}'},
                data:{'data':send_data},
                dataType:'json',
                success:function(data){
                    alert('예측 데이터를 가져옵니다. 성공');
                    console.log(data)
                },
                fail:function(){
                    alert('예측하는데 오류가 발생했습니다. 다시 시도해주세요.')
                }


            });
        }

    </script>
</head>
<body>
    <h1>메인페이지</h1>
    <div>
        {% csrf_token %} <!-- Django에서 POST 요청을 받을 때 확인하는 값. <form> 태그가 없어도 JavaScript로 POST 요청을 보내기 때문에 CSRF 토큰이 필요함-->
        <label> 길이,높이,넓이를 입력하세요.</label><br/>
        <input type='text' name='data' id='data'>
        {% comment %} <button type='button' onclick="getData()">예측</button> {% endcomment %}
        <button type='button' onclick="sendBtn()">예측</button>
        <br>
        <br>
        <div id='result'>입력데이터 :  {{result}}</div>
        <div id='result2'>예측무게 : {{result2}} g</div>        
    </div>
</body>
</html>
